<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Ma Boutique</title>
<style>
/* Ma Boutique — styles (aucune ressource externe, polices du système) */
:root{--p:#0f766e;--pd:#0b5a54;--pl:#e6f4f2;--bg:#f4f7f6;--card:#fff;--tx:#14211f;--mu:#5d6e6b;--bd:#dbe4e2;--ok:#15803d;--okb:#dcfce7;--wa:#b45309;--wab:#fef3c7;--ba:#b91c1c;--bab:#fee2e2;--r:14px;--fs:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.4;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
.hidden{display:none!important}
h1,h2,h3{margin:0}
h3{font-size:1.05rem;margin:14px 0 8px}
.card>h3:first-child{margin-top:0}
.app{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--p);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.topbar h1{flex:1;font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:46px;height:46px;border:0;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-size:1.3rem;cursor:pointer}
.icon-btn.dark{background:var(--bg);color:var(--tx)}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card .grid2{margin-bottom:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--mu)}.sm{font-size:.85rem}.r{text-align:right}.g{color:var(--ok)}.o{color:var(--wa)}
b.r,.rt b.r{color:var(--ba);text-align:right}
label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 5px;color:#2b3b38}
label small{font-weight:400;color:var(--mu)}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:14px 0}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;font:inherit;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx)}
input[type=checkbox]{width:24px;height:24px;min-height:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
textarea{min-height:90px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:10px 16px;border:1.5px solid var(--p);border-radius:12px;background:#fff;color:var(--p);font:inherit;font-weight:700;cursor:pointer;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--p);color:#fff}
.btn.danger{background:#fff;color:var(--ba);border-color:var(--ba)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mu)}
.btn.full{width:100%;margin-top:10px}
.btn.big{min-height:58px;font-size:1.1rem}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.45}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;border-left:5px solid var(--p);min-width:0}
.stat.g{border-left-color:var(--ok)}.stat.r{border-left-color:var(--ba)}.stat.o{border-left-color:var(--wa)}
.sl{font-size:.8rem;color:var(--mu);font-weight:600}
.sv{font-size:1.2rem;font-weight:800;margin-top:2px;word-break:break-word}
.sv.sm2{font-size:1rem}
.ss{font-size:.72rem;color:var(--mu);margin-top:2px}
.card.bigcash{background:var(--p);color:#fff;border:0}
.bigcash .sl,.bigcash .muted{color:#d4efeb}.bigcash .sv{font-size:1.7rem}
.list{margin-bottom:12px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:8px}
.item.tap,.line.tap{cursor:pointer}
.item .grow{flex:1;min-width:0}
.item .rt,.line .rt{text-align:right;flex-shrink:0}
.acts{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;flex-wrap:wrap}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.line:last-child{border-bottom:0}
.line.big{font-size:1.15rem;font-weight:800}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.warn{background:var(--wab);color:var(--wa)}.badge.bad{background:var(--bab);color:var(--ba)}
.wt{color:var(--ba);font-size:.8rem;font-weight:600}
.empty{padding:18px;text-align:center;color:var(--mu);font-size:.95rem}
.alert{padding:12px;border-radius:12px;margin-bottom:12px;font-size:.92rem}
.alert.warn{background:var(--wab);color:#7c3d06}.alert.bad{background:var(--bab);color:#7f1d1d}
.alert a{color:inherit;font-weight:700}
.chips,.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.pill{min-height:42px;padding:6px 14px;border:1.5px solid var(--bd);border-radius:99px;background:#fff;font:inherit;font-weight:600;color:var(--tx);cursor:pointer}
.chip.on,.pill.on{background:var(--p);border-color:var(--p);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--p);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{min-height:46px;border:0;background:#fff;color:var(--p);font:inherit;font-weight:700}
.seg button.on{background:var(--p);color:#fff}
.results{margin-top:8px;display:grid;gap:6px;max-height:300px;overflow:auto}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;font:inherit;text-align:left;cursor:pointer;color:var(--tx)}
.res small{color:var(--mu)}.res.dis{opacity:.5}
.cl{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.clr{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-top:6px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:48px;border:1.5px solid var(--p);border-radius:10px;background:#fff;color:var(--p);font-size:1.4rem;font-weight:800}
.qty input{width:64px;text-align:center;padding:6px}
.pr small{font-size:.8rem;color:var(--mu)}
.pr input{padding:6px 10px}
.lt{font-weight:800;text-align:right;order:2;font-size:1.1rem}
.pr{order:3;grid-column:1/-1;display:flex;align-items:center;gap:10px}
.pr small{white-space:nowrap}
.x{width:38px;height:38px;border:0;border-radius:10px;background:var(--bab);color:var(--ba);font-size:1rem}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45)}
.drawer .panel{width:82%;max-width:330px;height:100%;background:#fff;overflow:auto;padding-bottom:30px}
.dh2{background:var(--p);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;font-size:1.25rem;font-weight:800}
#drawerList button{display:flex;gap:12px;align-items:center;width:100%;min-height:54px;padding:8px 16px;border:0;border-bottom:1px solid var(--bd);background:#fff;font:inherit;text-align:left;color:var(--tx)}
#drawerList button.on{background:var(--pl);font-weight:700;color:var(--pd)}
#drawerList button span{font-size:1.3rem;width:30px}
.bb{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.bb button{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:62px;padding:6px 2px;border:0;background:#fff;font:inherit;font-size:.72rem;font-weight:600;color:var(--mu)}
.bb button span{font-size:1.35rem}
.bb button.on{color:var(--p)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);background:#fff;border-radius:20px 20px 0 0}
.mh h2{font-size:1.1rem}
.mb{padding:14px;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.confirm{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.confirm .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px}
.confirm .msg{margin-bottom:12px;line-height:1.5}
#toast{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
#toast .t{background:#14211f;color:#fff;padding:12px 16px;border-radius:12px;max-width:520px;font-size:.92rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast .t.err{background:var(--ba)}
.lock{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,var(--p),var(--pd));display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.lock .box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:360px;text-align:center}
.lock .box.wide{max-width:480px;text-align:left}
.lock .logo{font-size:3rem}
.lock input{text-align:center;font-size:1.4rem;letter-spacing:.3em;margin:10px 0}
/* Documents */
.docwrap{background:#e5ebe9;border-radius:12px;padding:10px;overflow:auto;margin-bottom:12px}
.doc{background:#fff;color:#000;font-family:"Courier New",ui-monospace,monospace;font-size:12px;padding:12px;margin:0 auto}
.doc.receipt{width:302px;max-width:100%}
.doc.a4{width:100%;max-width:794px;font-family:system-ui,Arial,sans-serif;font-size:13px;padding:18px}
.doc .dh{text-align:center;margin-bottom:6px}
.doc .shop{font-size:1.25em;font-weight:800}
.doc .dt{text-align:center;font-weight:800;border-top:1px dashed #000;border-bottom:1px dashed #000;padding:5px 0;margin:6px 0}
.doc .stamp{text-align:center;color:#b91c1c;font-weight:800;border:2px solid #b91c1c;margin:6px 0;padding:3px}
.doc .dm{margin-bottom:6px}
.doc table{width:100%;border-collapse:collapse}
.doc th{border-bottom:1px solid #000;text-align:left;padding:3px 2px}
.doc td{padding:3px 2px;vertical-align:top;border-bottom:1px dotted #aaa}
.doc th.r,.doc td.r{text-align:right}
.doc tr.ft td{font-weight:800;border-top:1px solid #000}
.doc .dtot>div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.doc .dtot .big{font-weight:800;font-size:1.15em;border-top:1px solid #000;margin-top:4px;padding-top:4px}
.doc .dfoot{text-align:center;margin-top:10px;border-top:1px dashed #000;padding-top:6px}
.doc.rep .tw{overflow:auto;margin-bottom:14px}
.doc.rep .dl{min-width:520px}
.doc.a4 th{background:#eef3f2}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff}
  #printArea{display:block!important}
  #printArea .doc{box-shadow:none;margin:0;max-width:none}
  #printArea .doc.receipt{width:72mm}
  #printArea .doc.rep .dl{min-width:0}
}

</style>
<style id="pageStyle"></style>
</head>
<body>
<div id="lock" class="lock hidden"></div>
<div id="app" class="app hidden">
  <header class="topbar">
    <button class="icon-btn" data-act="menu" aria-label="Menu">☰</button>
    <h1 id="title">Ma Boutique</h1>
    <button class="icon-btn" data-act="go" data-id="sale" aria-label="Nouvelle vente">🛒</button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <nav class="bb">
    <button data-act="go" data-id="dashboard"><span>📊</span>Accueil</button>
    <button data-act="go" data-id="sale"><span>🛒</span>Vendre</button>
    <button data-act="go" data-id="products"><span>📦</span>Stock</button>
    <button data-act="go" data-id="cash"><span>💰</span>Caisse</button>
    <button data-act="menu"><span>☰</span>Menu</button>
  </nav>
</div>
<div id="drawer" class="drawer hidden"><div class="panel"><div class="dh2">🏪 Ma Boutique</div><div id="drawerList"></div></div></div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="mh"><h2 id="modalTitle"></h2><button class="icon-btn dark" data-act="closeModal" aria-label="Fermer">✕</button></div><div id="modalBody" class="mb"></div></div></div>
<div id="confirm" class="confirm hidden"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
/* ============================================================
   MA BOUTIQUE - Gestion commerciale 100 % hors connexion
   HTML5 + CSS3 + JavaScript pur. Données : IndexedDB (sur le téléphone).
   Aucun appel réseau, aucun CDN, aucune police externe.
   ============================================================ */
(function () {
'use strict';

/* ---------- Constantes ---------- */
var STORES = ['products', 'sales', 'purchases', 'expenses', 'customers', 'suppliers', 'cash', 'stock', 'payments', 'spayments', 'log', 'meta'];
var UNITS = ['pièce', 'kg', 'g', 'litre', 'sachet', 'carton', 'paquet', 'boîte', 'bouteille', 'mètre', 'lot'];
var EXP_CATS = ['Transport', 'Loyer', 'Électricité', 'Communication', 'Salaire', 'Entretien', 'Frais de transfert Mobile Money', 'Autres dépenses'];
var METHODS = { especes: 'Espèces', flooz: 'Flooz', moov: 'Moov Money', autre: 'Autre', credit: 'Crédit' };
var PAYM = ['especes', 'flooz', 'moov', 'autre'];
var DEFAULT_SETTINGS = { id: 'settings', shopName: 'Ma Boutique', phone: '', address: '', footer: 'Merci de votre confiance !', allowNegative: false, cashInitial: 0, docFormat: 'receipt' };
var TITLES = {
  dashboard: 'Tableau de bord', products: 'Produits et stock', sale: 'Nouvelle vente', sales: 'Historique des ventes',
  invoices: 'Factures et reçus', expenses: 'Dépenses', cash: 'Caisse', customers: 'Clients', purchases: 'Fournisseurs et achats',
  purchaseNew: 'Nouvel achat', reports: 'Rapports et bénéfices', backup: 'Sauvegarde et restauration', settings: 'Paramètres'
};
var MENU = [
  ['dashboard', '📊', 'Tableau de bord'], ['products', '📦', 'Produits et stock'], ['sale', '🛒', 'Nouvelle vente'],
  ['sales', '🧾', 'Historique des ventes'], ['invoices', '🖨️', 'Factures et reçus'], ['expenses', '💸', 'Dépenses'],
  ['cash', '💰', 'Caisse'], ['customers', '👥', 'Clients'], ['purchases', '🚚', 'Fournisseurs et achats'],
  ['reports', '📈', 'Rapports et bénéfices'], ['backup', '💾', 'Sauvegarde et restauration'], ['settings', '⚙️', 'Paramètres de la boutique']
];

/* ---------- Outils ---------- */
var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function num(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; var n = parseFloat(String(v == null ? '' : v).replace(/[\s ]/g, '').replace(',', '.')); return isFinite(n) ? n : 0; }
function r2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function pad(n, l) { return String(n).padStart(l || 2, '0'); }
function fmt(n) { var x = Math.round(n); var s = Math.abs(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (x < 0 ? '-' : '') + s; }
function money(n) { return fmt(n) + ' FCFA'; }
function qf(n) { return String(Math.round(n * 1000) / 1000).replace('.', ','); }
function dkey(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dfr(k) { if (!k) return ''; var a = String(k).split('-'); return a[2] + '/' + a[1] + '/' + a[0]; }
function tfr(iso) { var d = new Date(iso); return dfr(dkey(d)) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function sum(arr, f) { return arr.reduce(function (a, x) { return a + f(x); }, 0); }
function UE(m) { var e = new Error(m); e.user = true; return e; }
function errMsg(e) {
  if (e && e.user) return e.message;
  if (e && e.name === 'QuotaExceededError') return "Espace de stockage plein : libérez de la place sur le téléphone. Rien n'a été enregistré.";
  if (e && e.name === 'ConstraintError') return 'Cette opération est déjà enregistrée (double appui évité).';
  return "Erreur d'enregistrement : " + ((e && e.message) || e) + ". Rien n'a été enregistré.";
}
function guard(fn) {
  var busy = false;
  return function () {
    if (busy) return Promise.resolve();
    busy = true; var self = this, a = arguments;
    return Promise.resolve().then(function () { return fn.apply(self, a); })
      .catch(function (e) { toast(errMsg(e), 'err'); })
      .then(function () { busy = false; }, function () { busy = false; });
  };
}
function csvText(rows) {
  return '﻿' + rows.map(function (r) {
    return r.map(function (c) { var s = String(c == null ? '' : c); if (/[";\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"'; return s; }).join(';');
  }).join('\r\n');
}
function lget(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignoré */ } }

/* ---------- Base de données (IndexedDB) ---------- */
var db = null, MEM = false;
var D = {}; STORES.forEach(function (s) { D[s] = []; });
function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
function openDB() {
  return new Promise(function (res, rej) {
    if (!window.indexedDB) return rej(new Error('IndexedDB indisponible'));
    var rq;
    try { rq = indexedDB.open('ma_boutique', 1); } catch (e) { return rej(e); }
    rq.onupgradeneeded = function (e) { var d = e.target.result; STORES.forEach(function (s) { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
    rq.onsuccess = function () { res(rq.result); };
    rq.onerror = function () { rej(rq.error || new Error('Ouverture impossible')); };
    rq.onblocked = function () { rej(new Error('Base bloquée par une autre fenêtre')); };
  });
}
function loadAll() {
  return Promise.all(STORES.map(function (n) {
    return new Promise(function (res, rej) {
      var t = db.transaction(n, 'readonly'), rq = t.objectStore(n).getAll();
      rq.onsuccess = function () { D[n] = rq.result || []; res(); };
      rq.onerror = function () { rej(rq.error); };
    });
  }));
}
function probe() {
  return new Promise(function (res, rej) {
    var t = db.transaction('meta', 'readwrite'), st = t.objectStore('meta');
    st.put({ id: '_probe', v: 1 });
    var g = st.get('_probe');
    g.onsuccess = function () { if (!g.result) { t.abort(); return rej(new Error('Lecture impossible après écriture')); } st.delete('_probe'); };
    t.oncomplete = function () { res(); };
    t.onerror = t.onabort = function () { rej(t.error || new Error('Écriture impossible')); };
  });
}
function applyToCache(ops) {
  ops.forEach(function (o) {
    var arr = D[o[0]];
    if (o[1] === 'clear') { arr.length = 0; return; }
    if (o[1] === 'delete') { var i = arr.findIndex(function (x) { return x.id === o[2]; }); if (i >= 0) arr.splice(i, 1); return; }
    var c = JSON.parse(JSON.stringify(o[2])), j = arr.findIndex(function (x) { return x.id === c.id; });
    if (j >= 0) arr[j] = c; else arr.push(c);
  });
}
/* ops : [store, 'add'|'put'|'delete'|'clear', valeur]  -> une seule transaction (tout ou rien) */
function commit(ops) {
  if (MEM) { applyToCache(ops); return Promise.resolve(); }
  return new Promise(function (resolve, reject) {
    var t, settled = false;
    function fail(e) { if (!settled) { settled = true; reject(e); } }
    try { t = db.transaction(Array.from(new Set(ops.map(function (o) { return o[0]; }))), 'readwrite'); } catch (e) { return fail(e); }
    t.oncomplete = function () { if (!settled) { settled = true; applyToCache(ops); resolve(); } };
    t.onabort = function () { fail(t.error || new Error('Transaction annulée')); };
    t.onerror = function () { /* l'annulation est traitée dans onabort */ };
    try {

function range(kind, from, to) {
  var now = new Date(), t = dkey(now);
  if (kind === 'today') return { from: t, to: t, label: "Aujourd'hui" };
  if (kind === 'week') { var diff = (now.getDay() + 6) % 7; var m = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diff); return { from: dkey(m), to: t, label: 'Cette semaine' }; }
  if (kind === 'month') return { from: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-01', to: t, label: 'Ce mois' };

  if (kind === 'custom') return { from: from || null, to: to || null, label: 'Du ' + (from ? dfr(from) : '…') + ' au ' + (to ? dfr(to) : '…') };

}
function inR(k, r) { return (!r.from || k >= r.from) && (!r.to || k <= r.to); }

/* ---------- Calculs métier ---------- */
function stockStatus(p) { if (p.qty <= 0) return 'out'; if (p.qty <= p.alert) return 'low'; return 'ok'; }
function saleCost(s) { return sum(s.lines, function (l) { return l.qty * l.cost; }); }
function salePays(id) { return D.payments.filter(function (p) { return p.saleId === id && !p.cancelled; }); }
function saleReceived(s) { return s.paid + sum(salePays(s.id), function (p) { return p.amount; }); }
function saleRemaining(s) { return s.status === 'valide' ? Math.max(0, r2(s.total - saleReceived(s))) : 0; }
function purPays(id) { return D.spayments.filter(function (p) { return p.purchaseId === id; }); }
function purPaid(p) { return p.paid + sum(purPays(p.id), function (x) { return x.amount; }); }
function purRemaining(p) { return Math.max(0, r2(p.total - purPaid(p))); }
function custOf(s) { var c = s.customerId ? byId(D.customers, s.customerId) : null; return c ? c.name : (s.customerName || ''); }
function custBalance(id) { return r2(sum(D.sales.filter(function (s) { return s.customerId === id; }), saleRemaining)); }
function suppBalance(id) { return r2(sum(D.purchases.filter(function (p) { return p.supplierId === id; }), purRemaining)); }
function stockValueCost() { return sum(D.products, function (p) { return Math.max(0, p.qty) * p.buy; }); }
function stockValueSale() { return sum(D.products, function (p) { return Math.max(0, p.qty) * p.sell; }); }
function cashBalances(toKey) {
  var cash = num(settings().cashInitial), other = 0;
  D.cash.forEach(function (m) {
    if (toKey && m.dateKey > toKey) return;
    var v = m.type === 'in' ? m.amount : -m.amount;
    if (m.method === 'especes') cash += v; else other += v;
  });
  return { cash: r2(cash), other: r2(other) };
}
/* Méthode : coût moyen unitaire pondéré (CMUP). Le coût d'une vente est figé au moment de la vente. */
function metrics(r) {
  var sales = D.sales.filter(function (s) { return s.status === 'valide' && inR(s.dateKey, r); });
  var ca = sum(sales, function (s) { return s.total; });
  var disc = sum(sales, function (s) { return s.discount; });
  var cogs = sum(sales, saleCost);
  var exps = D.expenses.filter(function (e) { return inR(e.dateKey, r); });
  var charges = sum(exps, function (e) { return e.amount; });
  var enc = 0;
  D.cash.forEach(function (m) {
    if (!inR(m.dateKey, r)) return;
    if (m.type === 'in' && (m.source === 'vente' || m.source === 'remboursement')) enc += m.amount;
    if (m.type === 'out' && m.source === 'annulation') enc -= m.amount;
  });
  return { sales: sales, nSales: sales.length, ca: r2(ca), disc: r2(disc), cogs: r2(cogs), brut: r2(ca - cogs), charges: r2(charges), net: r2(ca - cogs - charges), enc: r2(enc), exps: exps };
}
var NATURES = [
  ['vente', 'in', 'Ventes encaissées'], ['remboursement', 'in', 'Crédits clients remboursés (reçus)'], ['apport', 'in', 'Apports de caisse'],
  ['annulation', 'out', 'Ventes annulées (argent rendu)'], ['depense', 'out', 'Dépenses payées'], ['achat', 'out', 'Achats payés aux fournisseurs'],
  ['paiement_fournisseur', 'out', 'Dettes fournisseurs payées'], ['retrait', 'out', 'Retraits de caisse']
];
function cashSummary(r) {
  var rows = NATURES.map(function (n) {
    var e = 0, o = 0;
    D.cash.forEach(function (m) {
      if (m.source !== n[0] || !inR(m.dateKey, r)) return;
      if (m.method === 'especes') e += m.amount; else o += m.amount;
    });
    return { key: n[0], dir: n[1], label: n[2], esp: r2(e), oth: r2(o) };
  });
  return rows;
}
function mkCash(id, type, amount, method, source, label, refId, dateKey) {
  return { id: id, date: new Date().toISOString(), dateKey: dateKey || dkey(), type: type, amount: amount, method: method, source: source, label: label, refId: refId || '' };

function findByName(arr, name) { var n = name.trim().toLowerCase(); return arr.filter(function (x) { return x.name.trim().toLowerCase() === n; })[0] || null; }
function allocate(items, amount) {
  var out = [], left = amount;
  for (var i = 0; i < items.length; i++) {
    if (left <= 0.0001) break;
    var a = Math.min(left, items[i].rest);
    if (a > 0) { out.push([items[i], r2(a)]); left = r2(left - a); }
  }
  return out;
}

    '<label>Message en bas des reçus</label><input name="footer" value="' + esc(st.footer) + '"><label>Solde initial de la caisse (FCFA, espèces)</label><input name="cashInitial" type="number" inputmode="decimal" step="any" value="' + esc(st.cashInitial) + '">' +
    '<label>Format de reçu par défaut</label><select name="docFormat"><option value="receipt"' + (st.docFormat !== 'a4' ? ' selected' : '') + '>Reçu (petit ticket)</option><option value="a4"' + (st.docFormat === 'a4' ? ' selected' : '') + '>Facture A4</option></select>' +

    '<div class="card"><h3>Code PIN (facultatif)</h3><p class="muted">Verrouille l\'application à l\'ouverture. C\'est une protection simple contre les curieux, pas un chiffrement des données.</p>' +
    (pin ? '<button class="btn full" data-act="pinChange">Changer le PIN</button><button class="btn danger full" data-act="pinOff">Désactiver le PIN</button>' : '<button class="btn primary full" data-act="pinOn">Activer un code PIN</button>') + '</div>' +
    '<div class="card"><h3>Méthode de calcul</h3><p class="muted sm">Coût des marchandises = coût moyen pondéré (CMUP) de chaque produit, figé au moment de la vente. Bénéfice brut = ventes nettes des remises − coût des marchandises vendues. Bénéfice net estimé = bénéfice brut − dépenses de la période. Les achats augmentent le stock (ils ne sont pas une charge). Les ventes annulées sont exclues. Ce sont des estimations de gestion, pas une comptabilité réglementaire.</p></div>' +
    '<div class="card"><h3>À propos</h3><p class="muted sm">Ma Boutique 1.0 — fonctionne sans Internet. Aucune donnée n\'est envoyée en ligne.</p></div>';
};

/* ---------- Navigation et rendu ---------- */
function rq(n) { return Math.round(n * 1000) / 1000; }
function render() {
  $('#title').textContent = TITLES[cur] || 'Ma Boutique';
  $('#view').innerHTML = VIEWS[cur]();
  $$('.bb button').forEach(function (b) { b.classList.toggle('on', b.dataset.id === cur); });
  $$('#drawerList button').forEach(function (b) { b.classList.toggle('on', b.dataset.id === cur); });
  var bn = $('#banner'); bn.innerHTML = MEM ? '<div class="alert bad">⚠ MODE TEMPORAIRE : les données seront perdues à la fermeture de l\'application. Faites des sauvegardes !</div>' : '';
  if (AFTER[cur]) AFTER[cur]();
}
function go(v) {
  closeModal(); $('#drawer').classList.add('hidden'); cur = v; render(); window.scrollTo(0, 0);
}
function refreshLists() {
  var e;
  if ((e = $('#plist'))) e.innerHTML = productItems();
  if ((e = $('#culist'))) e.innerHTML = customerItems();
}

document.addEventListener('click', function (e) {
  var mdl = $('#modal');
  if (e.target === mdl) { closeModal(); return; }
  if (e.target === $('#drawer')) { $('#drawer').classList.add('hidden'); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  var a = ACTIONS[el.dataset.act]; if (a) a(el, e);
});
function onInput(e) { var t = e.target, k = t.dataset && t.dataset.in; if (k && INPUT[k]) INPUT[k](t, e); }
document.addEventListener('input', onInput);
/* « change » seulement pour les listes et dates : sur un champ texte, il se déclenche au toucher d'un bouton (perte du focus) et ferait disparaître le bouton avant le clic. */
document.addEventListener('change', function (e) { var t = e.target; if (t.tagName === 'SELECT' || t.type === 'date' || t.type === 'checkbox') onInput(e); });
document.addEventListener('submit', function (e) {
  var f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); if (FORMS[f.dataset.form]) FORMS[f.dataset.form](f);
});

ACTIONS.go = function (el) { go(el.dataset.id); };
ACTIONS.menu = function () { $('#drawer').classList.toggle('hidden'); };
ACTIONS.closeModal = closeModal;
ACTIONS.tab = function (el) { UI.tab = el.dataset.v; render(); };

}

ACTIONS.prodEdit = function (el) { var p = byId(D.products, el.dataset.id); if (p) openModal('Modifier le produit', productForm(p)); };
FORMS.product = guard(function (f) {
  var g = function (n) { return f.elements[n].value; };
  var id = g('id'), name = g('name').trim(), unit = g('unit').trim(), buy = num(g('buy')), sell = num(g('sell')), alert = num(g('alert'));
  if (!name) throw UE('Le nom du produit est obligatoire.');
  if (!unit) throw UE("L'unité est obligatoire.");
  if (buy < 0 || sell < 0 || alert < 0) throw UE('Les montants ne peuvent pas être négatifs.');
  var dup = findByName(D.products, name); if (dup && dup.id !== id) throw UE('Un produit avec ce nom existe déjà.');
  var ops = [], now = new Date().toISOString(), p;
  var warn = sell < buy;
  if (!id) {
    var qty = rq(num(g('qty'))); if (qty < 0) throw UE('La quantité ne peut pas être négative.');
    var ctr = counters(), code = 'P' + pad(ctr.next('P'), 4);
    p = { id: uid(), code: code, name: name, category: g('category').trim(), qty: qty, unit: unit, buy: buy, sell: sell, alert: alert, createdAt: now, createdKey: dkey() };
    ops.push(['products', 'add', p], ['meta', 'put', ctr.doc]);
    if (qty > 0) ops.push(['stock', 'add', mkStock(p, 'entree', 'Stock initial', qty, qty, p.id)]);
  } else {
    var old = byId(D.products, id); if (!old) throw UE('Produit introuvable.');
    p = Object.assign({}, old, { name: name, category: g('category').trim(), unit: unit, buy: buy, sell: sell, alert: alert });
    ops.push(['products', 'put', p]);
  }
  return commit(ops).then(function () { closeModal(); render(); toast(warn ? 'Enregistré. Attention : le prix de vente est inférieur au prix d\'achat.' : 'Produit enregistré.', warn ? 'err' : ''); });
});
ACTIONS.prodDel = function (el) {
  var p = byId(D.products, el.dataset.id); if (!p) return;
  confirmBox('Supprimer le produit <b>' + esc(p.name) + '</b> ?<br><small>Les ventes déjà faites sont conservées. Cette action est définitive.</small>', 'Oui, supprimer', null, true).then(function (r) {
    if (!r) return;
    commit([['products', 'delete', p.id], logOp('produit_supprime', 'Produit supprimé : ' + p.code + ' ' + p.name + ' (stock ' + qf(p.qty) + ')', p.id)]).then(function () { closeModal(); render(); toast('Produit supprimé.'); }, function (e) { toast(errMsg(e), 'err'); });
  });
};
ACTIONS.prodAdjust = function (el) {
  var p = byId(D.products, el.dataset.id); if (!p) return;
  openModal('Ajuster le stock', '<form data-form="adjust"><input type="hidden" name="id" value="' + p.id + '"><div class="line"><span>' + esc(p.name) + '</span><b>Actuel : ' + qf(p.qty) + ' ' + esc(p.unit) + '</b></div><label>Nouvelle quantité réelle (comptée)</label><input name="qty" type="number" inputmode="decimal" step="any" required value="' + esc(p.qty) + '"><label>Motif</label><input name="note" placeholder="Inventaire, casse, perte, don…" required><button class="btn primary full" type="submit">Enregistrer l\'ajustement</button></form>');
};
FORMS.adjust = guard(function (f) {
  var p = byId(D.products, f.elements.id.value); if (!p) throw UE('Produit introuvable.');
  var nq = rq(num(f.elements.qty.value)), note = f.elements.note.value.trim(); if (!note) throw UE('Indiquez le motif.');
  var diff = rq(nq - p.qty); if (diff === 0) throw UE('La quantité est identique.');
  var np = Object.assign({}, p, { qty: nq });
  return commit([['products', 'put', np], ['stock', 'add', mkStock(p, diff > 0 ? 'entree' : 'sortie', 'Ajustement : ' + note, Math.abs(diff), nq, p.id)]]).then(function () { closeModal(); render(); toast('Stock ajusté.'); });
});
function movesHTML(list) {
  return list.length ? list.map(function (m) { return '<div class="line"><span>' + esc(m.productName) + '<br><small class="muted">' + tfr(m.date) + ' · ' + esc(m.reason) + ' · stock après : ' + qf(m.after) + '</small></span><b class="' + (m.type === 'entree' ? 'g' : 'r') + '">' + (m.type === 'entree' ? '+' : '−') + qf(m.qty) + '</b></div>'; }).join('') : empty('Aucun mouvement.');
}
ACTIONS.prodMoves = function (el) { var p = byId(D.products, el.dataset.id); openModal('Historique : ' + (p ? p.name : ''), movesHTML(D.stock.filter(function (m) { return m.productId === el.dataset.id; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 300))); };
ACTIONS.stockHist = function () { openModal('Historique du stock (entrées et sorties)', movesHTML(D.stock.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 300))); };
ACTIONS.csvProducts = function () {
  var rows = [['Code', 'Nom', 'Catégorie', 'Quantité', 'Unité', "Prix d'achat", 'Prix de vente', "Seuil d'alerte", 'Valeur stock (coût)', 'Date de création']];
  D.products.forEach(function (p) { rows.push([p.code, p.name, p.category || '', qf(p.qty), p.unit, Math.round(p.buy * 100) / 100, p.sell, p.alert, Math.round(Math.max(0, p.qty) * p.buy), dfr(p.createdKey || (p.createdAt || '').slice(0, 10))]); });
  exportModal('produits-' + dkey() + '.csv', csvText(rows), 'text/csv');
};
ACTIONS.csvOps = function () {
  var rows = [['Date', 'Type', 'Numéro', 'Tiers', 'Détail', 'Montant', 'Payé / reçu', 'Reste', 'Mode', 'Statut']];
  D.sales.forEach(function (s) { rows.push([dfr(s.dateKey), 'Vente', s.no, custOf(s), s.lines.map(function (l) { return qf(l.qty) + ' ' + l.name; }).join(' + '), s.total, saleReceived(s), saleRemaining(s), METHODS[s.method], s.status === 'valide' ? 'Valide' : 'Annulée']); });
  D.purchases.forEach(function (p) { rows.push([dfr(p.dateKey), 'Achat', p.no, suppName(p), p.lines.map(function (l) { return qf(l.qty) + ' ' + l.name; }).join(' + '), p.total, purPaid(p), purRemaining(p), METHODS[p.payMethod], 'Valide']); });
  D.expenses.forEach(function (e) { rows.push([dfr(e.dateKey), 'Dépense', e.ref || '', '', e.category + (e.description ? ' - ' + e.description : ''), e.amount, e.amount, 0, METHODS[e.method], 'Valide']); });
  D.cash.filter(function (m) { return m.source === 'apport' || m.source === 'retrait'; }).forEach(function (m) { rows.push([dfr(m.dateKey), m.source === 'apport' ? 'Apport de caisse' : 'Retrait de caisse', '', '', m.label, m.amount, m.amount, 0, METHODS[m.method], 'Valide']); });
  D.payments.forEach(function (p) { var c = byId(D.customers, p.customerId), s = byId(D.sales, p.saleId); rows.push([dfr(p.dateKey), 'Paiement client', s ? s.no : '', c ? c.name : '', p.note || '', p.amount, p.amount, 0, METHODS[p.method], p.cancelled ? 'Annulé' : 'Valide']); });
  D.spayments.forEach(function (p) { var s = byId(D.suppliers, p.supplierId), a = byId(D.purchases, p.purchaseId); rows.push([dfr(p.dateKey), 'Paiement fournisseur', a ? a.no : '', s ? s.name : '', p.note || '', p.amount, p.amount, 0, METHODS[p.method], 'Valide']); });
  rows = [rows[0]].concat(rows.slice(1).sort(function (a, b) { var x = a[0].split('/').reverse().join(''), y = b[0].split('/').reverse().join(''); return x < y ? -1 : x > y ? 1 : 0; }));
  exportModal('operations-' + dkey() + '.csv', csvText(rows), 'text/csv');
};

/* ---------- Ventes ---------- */
ACTIONS.addLine = function (el) {
  var p = byId(D.products, el.dataset.id); if (!p) return;
  var ex = CART.lines.filter(function (l) { return l.productId === p.id; })[0];
  if (ex) ex.qty = rq(num(ex.qty) + 1); else CART.lines.push({ productId: p.id, name: p.name, qty: 1, price: p.sell });
  $('#cartLines').innerHTML = cartLinesHTML(); updateSaleTotals();
};
ACTIONS.rmLine = function (el) { CART.lines.splice(+el.dataset.i, 1); $('#cartLines').innerHTML = cartLinesHTML(); updateSaleTotals(); };
ACTIONS.qtyInc = function (el) { var l = CART.lines[+el.dataset.i]; l.qty = rq(num(l.qty) + 1); $('#cartLines').innerHTML = cartLinesHTML(); updateSaleTotals(); };
ACTIONS.qtyDec = function (el) { var l = CART.lines[+el.dataset.i]; l.qty = Math.max(0, rq(num(l.qty) - 1)); $('#cartLines').innerHTML = cartLinesHTML(); updateSaleTotals(); };
ACTIONS.pm = function (el) { CART.method = el.dataset.id; CART.paid = null; $('#payBox').innerHTML = payHTML(); updateSaleTotals(); };
ACTIONS.clearCart = function () { confirmBox('Vider le panier ?', 'Oui, vider').then(function (r) { if (r) { CART = newCart(); UI.sQ = ''; render(); } }); };
ACTIONS.saveSale = guard(function () {
  var c = CART; if (!c || !c.lines.length) throw UE('Ajoutez au moins un produit.');
  var st = settings(), lines = [], per = {};
  c.lines.forEach(function (l) {
    var p = byId(D.products, l.productId); if (!p) throw UE("Un produit du panier n'existe plus : " + l.name);
    var q = num(l.qty), pr = num(l.price);
    if (!(q > 0)) throw UE('Quantité invalide pour ' + p.name + '.');
    if (pr < 0) throw UE('Prix invalide pour ' + p.name + '.');
    per[p.id] = (per[p.id] || 0) + q;
    lines.push({ productId: p.id, code: p.code, name: p.name, unit: p.unit, qty: q, price: pr, cost: p.buy });
  });
  if (!st.allowNegative) Object.keys(per).forEach(function (id) { var p = byId(D.products, id); if (per[id] > p.qty + 1e-9) throw UE('Stock insuffisant pour ' + p.name + ' : disponible ' + qf(p.qty) + ' ' + p.unit + '.'); });
  var sub = r2(sum(lines, function (l) { return l.qty * l.price; })), disc = r2(num(c.discount));
  if (disc < 0 || disc > sub) throw UE('La remise doit être comprise entre 0 et ' + fmt(sub) + ' FCFA.');
  var total = r2(sub - disc); if (!(total > 0)) throw UE('Le total doit être supérieur à 0.');
  var paid = r2(cartPaid()); if (paid < 0 || paid > total + 0.001) throw UE('Le montant reçu doit être compris entre 0 et ' + fmt(total) + ' FCFA.');
  var rest = r2(total - paid), name = c.client.trim();
  if (rest > 0 && !name) throw UE('Indiquez le nom du client : il reste ' + fmt(rest) + ' FCFA à payer (crédit).');
  var ops = [], now = new Date().toISOString(), dk = dkey(), ctr = counters();
  var cust = name ? findByName(D.customers, name) : null;
  if (name && !cust) { cust = { id: uid(), name: name, phone: '', address: '', createdAt: now }; ops.push(['customers', 'add', cust]); }
  var no = 'V-' + dk.replace(/-/g, '') + '-' + pad(ctr.next('V-' + dk), 3);
  var payMethod = c.method === 'credit' ? c.payMethod : c.method;
  var sale = { id: c.draft, no: no, date: now, dateKey: dk, customerId: cust ? cust.id : '', customerName: name, lines: lines, subtotal: sub, discount: disc, total: total, paid: paid, method: c.method, payMethod: payMethod, status: 'valide' };
  ops.push(['sales', 'add', sale]);
  Object.keys(per).forEach(function (id) {
    var p = byId(D.products, id), np = Object.assign({}, p, { qty: rq(p.qty - per[id]) });
    ops.push(['products', 'put', np], ['stock', 'add', mkStock(p, 'sortie', 'Vente ' + no, per[id], np.qty, sale.id)]);
  });
  if (paid > 0) ops.push(['cash', 'add', mkCash('cs_' + sale.id, 'in', paid, payMethod, 'vente', 'Vente ' + no, sale.id)]);
  ops.push(['meta', 'put', ctr.doc]);
  return commit(ops).then(function () { CART = newCart(); UI.sQ = ''; render(); toast('Vente enregistrée : ' + no); showDoc(sale.id); });
});
ACTIONS.saleOpen = function (el) { showSale(el.dataset.id); };
ACTIONS.sFilter = function (el) { UI.sSt = el.dataset.id; render(); };
ACTIONS.saleCancel = function (el) {
  var s = byId(D.sales, el.dataset.id); if (!s || s.status !== 'valide') return;
  var recv = saleReceived(s);
  confirmBox('Annuler la vente <b>' + esc(s.no) + '</b> ?<br><small>Le stock sera remis. ' + (recv > 0 ? 'Vous devez rendre ' + money(recv) + ' au client (une sortie de caisse sera enregistrée). ' : '') + 'La vente reste visible dans l\'historique comme « annulée ».</small>', 'Oui, annuler la vente', 'Motif (facultatif)', true).then(function (r) {
    if (!r) return;
    cancelSale(s.id, r.text).then(function () { closeModal(); render(); toast('Vente annulée, stock remis.'); }, function (e) { toast(errMsg(e), 'err'); });
  });
};
function cancelSale(id, reason) {
  var s = byId(D.sales, id); if (!s || s.status !== 'valide') return Promise.reject(UE('Cette vente ne peut pas être annulée.'));
  var ops = [], per = {};
  s.lines.forEach(function (l) { per[l.productId] = (per[l.productId] || 0) + l.qty; });
  Object.keys(per).forEach(function (pid) {

  LASTEXPORT.backup = true;
};
function validateBackup(o) {
  var errs = [], counts = {};
  if (!o || typeof o !== 'object') return { ok: false, errs: ["Le fichier n'est pas une sauvegarde valide."] };
  if (o.app !== 'ma-boutique') return { ok: false, errs: ["Ce fichier n'a pas été créé par Ma Boutique."] };
  if (o.version !== 1) errs.push('Version de sauvegarde inconnue : ' + o.version);
  if (!o.data || typeof o.data !== 'object') { errs.push('Données manquantes.'); return { ok: false, errs: errs }; }
  STORES.forEach(function (s) {
    var a = o.data[s]; if (s === 'log' || s === 'meta' || s === 'payments' || s === 'spayments') { if (a === undefined) a = []; }
    if (!Array.isArray(a)) { errs.push('Section « ' + s + ' » manquante ou invalide.'); return; }
    counts[s] = a.length;
    a.forEach(function (x, i) { if (!x || typeof x !== 'object' || typeof x.id !== 'string' || !x.id) errs.push('Section ' + s + ', ligne ' + (i + 1) + ' : identifiant manquant.'); });
  });
  if (!errs.length) {
    o.data.products.forEach(function (p) { if (!isFinite(p.qty) || !isFinite(p.buy) || !isFinite(p.sell) || typeof p.name !== 'string') errs.push('Produit invalide : ' + (p.name || p.id)); });
    o.data.sales.forEach(function (s) { if (!Array.isArray(s.lines) || !isFinite(s.total) || !isFinite(s.paid)) errs.push('Vente invalide : ' + (s.no || s.id)); });
    o.data.purchases.forEach(function (s) { if (!Array.isArray(s.lines) || !isFinite(s.total)) errs.push('Achat invalide : ' + (s.no || s.id)); });
    o.data.expenses.forEach(function (s) { if (!isFinite(s.amount)) errs.push('Dépense invalide : ' + s.id); });
    o.data.cash.forEach(function (s) { if (!isFinite(s.amount) || (s.type !== 'in' && s.type !== 'out')) errs.push('Mouvement de caisse invalide : ' + s.id); });
  }
  return { ok: errs.length === 0, errs: errs.slice(0, 8), counts: counts };
}

    if (!r) return;
    var ops = [];
    STORES.forEach(function (s) {
      if (s === 'meta') { D.meta.filter(function (x) { return x.id !== 'pin'; }).forEach(function (x) { ops.push(['meta', 'delete', x.id]); }); return; }
      ops.push([s, 'clear']);
    });
    STORES.forEach(function (s) { (o.data[s] || []).forEach(function (x) { if (s === 'meta' && x.id === 'pin') return; ops.push([s, 'put', x]); }); });
    return commit(ops).then(function () { render(); toast('Données restaurées.'); });
  });
}
ACTIONS.restoreGo = guard(function () {
  var f = $('#restoreFile'), t = $('#restoreText').value.trim();
  if (f && f.files && f.files[0]) {
    return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = function () { rej(UE('Lecture du fichier impossible.')); }; fr.readAsText(f.files[0]); }).then(doRestore);
  }
  if (t) return doRestore(t);
  throw UE('Choisissez un fichier de sauvegarde ou collez son contenu.');
});

/* ---------- Code PIN ---------- */
function h53(str, seed) {
  var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (var i = 0; i < str.length; i++) { var ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function hashPin(s) { var x = 'mb|' + String(s).trim().toLowerCase(); return h53(x, 1) + h53(x, 7); }
function pinForm(kind) {
  var pin = byId(D.meta, 'pin');
  return '<form data-form="' + kind + '">' + (pin ? '<label>PIN actuel</label><input name="cur" type="password" inputmode="numeric" autocomplete="off" required>' : '') +
    (kind === 'pinoff' ? '' : '<label>Nouveau PIN (4 à 6 chiffres)</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="off" required><label>Mot de secours (en cas d\'oubli du PIN)</label><input name="secret" placeholder="Un mot que vous seul connaissez" required autocomplete="off">') +
    '<button class="btn primary full" type="submit">Valider</button></form>';
}
ACTIONS.pinOn = function () { openModal('Activer le PIN', pinForm('pinset')); };
ACTIONS.pinChange = function () { openModal('Changer le PIN', pinForm('pinset')); };
ACTIONS.pinOff = function () { openModal('Désactiver le PIN', pinForm('pinoff')); };
FORMS.pinset = guard(function (f) {
  var pin = byId(D.meta, 'pin');
  if (pin && hashPin(f.elements.cur.value) !== pin.h) throw UE('PIN actuel incorrect.');
  var p = f.elements.pin.value.trim(); if (!/^[0-9]{4,6}$/.test(p)) throw UE('Le PIN doit contenir 4 à 6 chiffres.');
  var s = f.elements.secret.value.trim(); if (!s) throw UE('Le mot de secours est obligatoire.');
  return commit([['meta', 'put', { id: 'pin', h: hashPin(p), s: hashPin(s) }]]).then(function () { closeModal(); render(); toast('PIN enregistré. Il sera demandé à la prochaine ouverture.'); });
});
FORMS.pinoff = guard(function (f) {
  var pin = byId(D.meta, 'pin'); if (!pin || hashPin(f.elements.cur.value) !== pin.h) throw UE('PIN incorrect.');
  return commit([['meta', 'delete', 'pin']]).then(function () { closeModal(); render(); toast('PIN désactivé.'); });
});
function showLock() {
  var pin = byId(D.meta, 'pin'), L = $('#lock');
  L.classList.remove('hidden');
  L.innerHTML = '<div class="box"><div class="logo">🏪</div><h2>' + esc(settings().shopName) + '</h2><p class="muted">Entrez votre code PIN</p><input id="lockIn" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"><div id="lockErr" class="wt"></div><button class="btn primary full" id="lockGo">Ouvrir</button><button class="btn ghost full" id="lockForgot">PIN oublié ?</button></div>';
  function tryOpen() { if (hashPin($('#lockIn').value) === pin.h) { L.classList.add('hidden'); L.innerHTML = ''; start(); } else { $('#lockErr').textContent = 'PIN incorrect.'; $('#lockIn').value = ''; } }
  $('#lockGo').onclick = tryOpen; $('#lockIn').onkeydown = function (e) { if (e.key === 'Enter') tryOpen(); };
  $('#lockForgot').onclick = function () {
    L.innerHTML = '<div class="box"><h2>PIN oublié</h2><p class="muted">Entrez votre mot de secours.</p><input id="lockSec" autocomplete="off"><div id="lockErr" class="wt"></div><button class="btn primary full" id="secGo">Valider</button><button class="btn ghost full" id="secBack">Retour</button></div>';
    $('#secBack').onclick = showLock;
    $('#secGo').onclick = function () {
      if (hashPin($('#lockSec').value) === pin.s) { commit([['meta', 'delete', 'pin']]).then(function () { L.classList.add('hidden'); L.innerHTML = ''; start(); setTimeout(function () { toast('PIN désactivé. Vous pouvez en définir un nouveau dans Paramètres.'); }, 300); }); }
      else $('#lockErr').textContent = 'Mot de secours incorrect.';
    };
  };
}

/* ---------- Démarrage ---------- */
function buildChrome() {
  $('#drawerList').innerHTML = MENU.map(function (m) { return '<button data-act="go" data-id="' + m[0] + '"><span>' + m[1] + '</span>' + esc(m[2]) + '</button>'; }).join('');
}
function start() {
  buildChrome(); $('#app').classList.remove('hidden'); cur = 'dashboard'; render();
}
function showStorageFail(e) {
  var L = $('#lock'); L.classList.remove('hidden');
  L.innerHTML = '<div class="box wide"><div class="logo">⚠️</div><h2>Stockage durable indisponible</h2><p>Cette application doit enregistrer vos données dans la mémoire du téléphone (IndexedDB), mais ce n\'est pas possible ici.</p><p class="muted sm">Détail technique : ' + esc((e && e.message) || e) + '</p><p><b>Solution :</b> générez l\'APK avec un convertisseur qui utilise le WebView Android du système et autorise le stockage local (« DOM storage / local storage / IndexedDB »), ou essayez un autre convertisseur. Si vous ouvrez le fichier en mode « navigation privée », ouvrez-le en mode normal.</p>' +
    '<p>Vous pouvez continuer en <b>mode temporaire</b> pour tester, mais <b>tout sera perdu à la fermeture</b>.</p><button class="btn danger full" id="memGo">Continuer en mode temporaire</button></div>';
  $('#memGo').onclick = function () { MEM = true; L.classList.add('hidden'); L.innerHTML = ''; start(); };
}
function init() {
  openDB().then(function (d) { db = d; db.onversionchange = function () { try { db.close(); } catch (e) { /* ignoré */ } }; return probe(); })
    .then(loadAll)
    .then(function () {
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignoré */ }
      if (byId(D.meta, 'pin')) showLock(); else start();
    })
    .catch(function (e) { db = null; showStorageFail(e); });
}
window.addEventListener('error', function (e) { toast('Erreur inattendue : ' + (e.message || ''), 'err'); });
window.addEventListener('unhandledrejection', function (e) { toast('Erreur : ' + errMsg(e.reason), 'err'); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
